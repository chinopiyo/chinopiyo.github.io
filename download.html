<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音声ダウンロード</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: sans-serif;
      background: #ffffff;
    }

    #download-button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: #333333;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
    }

    #error {
      color: #333333;
    }
  </style>
</head>

<body>
  <a id="download-button" href="#" download>音声をダウンロード</a>
  <p id="error" hidden>ファイルを確認できませんでした。</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const button = document.getElementById("download-button");
    const error = document.getElementById("error");

    const validFile =
      file &&
      /^[A-Za-z0-9._,-]+\.(mp3|wav)$/i.test(file);

    if (validFile) {
      button.href = "./" + file;
      button.download = file;
    } else {
      button.hidden = true;
      error.hidden = false;
    }
  </script>
</body>
</html>
